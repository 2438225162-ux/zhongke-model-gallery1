header{position:sticky;top:0;z-index:5;padding:16px 22px;background:#17202af2;color:white;box-shadow:0 2px 14px #0003;backdrop-filter:blur(8px)}

main{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:20px}
.card{overflow:hidden;background:var(--card);border-radius:12px;box-shadow:0 2px 12px #26344218;content-visibility:auto;contain-intrinsic-size:260px}
.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:white}.card h2{margin:11px 13px 13px;font-size:14px;color:var(--muted)}
.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted)}
@media(max-width:560px){main{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:10px}header{padding:13px}.card h2{font-size:12px}}
</style>
